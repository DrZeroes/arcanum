name: Deploy to OVH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy static site via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftp
          server-dir: ${{ secrets.OVH_FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/docs/*.json
            **/graphify-out/**
            **/.graphify_*
            **/.graphifyignore
            **/descriptions
